---
- name: init machine uavm
  hosts:
    - uavm
  become: true

  tasks:

  # ─── Disable unattended-upgrades ────────────────────────────

    - name: Stop and disable unattended-upgrades
      ansible.builtin.systemd:
        name: unattended-upgrades
        state: stopped
        enabled: false
      failed_when: false

    - name: Stop and disable apt daily timers
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer
      failed_when: false

    - name: Mask unattended-upgrades so it cannot restart
      ansible.builtin.systemd:
        name: unattended-upgrades
        masked: true
      failed_when: false

    - name: Kill leftover apt/dpkg processes
      ansible.builtin.shell: |
        pkill -9 apt || true
        pkill -9 dpkg || true
      changed_when: false
      failed_when: false

    - name: Wait for apt lock to be released
      ansible.builtin.shell: >
        while fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock \
        /var/cache/apt/archives/lock /var/lib/dpkg/lock >/dev/null 2>&1; do
          sleep 3
        done
      changed_when: false
      failed_when: false

  # ─── Base APT packages ──────────────────────────────────────

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - python3
          - python3-pip
          - python3-venv
          - python3-dev
          - pipx
          - git
          - wget
          - curl
          - unzip
          - zip
          - firefox
          # Forensics tools
          - dc3dd
          - yara
          - suricata
          - snort
          # Docker dependencies
          - ca-certificates
          - gnupg
          - lsb-release
          - apt-transport-https
          # ViperMonkey dependencies
          - libxml2-dev
          - libxslt1-dev
          - zlib1g-dev
        state: present
        update_cache: 'yes'

  # ─── Docker ─────────────────────────────────────────────────

    - name: Create Docker apt keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker GPG key
      ansible.builtin.shell: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
          | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        chmod a+r /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Add Docker apt repository
      ansible.builtin.shell: |
        echo "deb [arch=$(dpkg --print-architecture) \
          signed-by=/etc/apt/keyrings/docker.gpg] \
          https://download.docker.com/linux/ubuntu \
          $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
          > /etc/apt/sources.list.d/docker.list
      args:
        creates: /etc/apt/sources.list.d/docker.list

    - name: Install Docker Engine
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: 'yes'

    - name: Enable and start Docker service
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Add user to docker group
      ansible.builtin.user:
        name: user
        groups: docker
        append: true

  # ─── Download prebuilt docker container ─────────────────────

    - name: Install oletools (olevba, oleid, mraptor) via pipx
      ansible.builtin.shell: |
        pipx install oletools
        pipx ensurepath
      environment:
        PIPX_HOME: /opt/pipx
        PIPX_BIN_DIR: /usr/local/bin
      args:
        creates: /usr/local/bin/olevba
      failed_when: false

    - name: Create vmonkey image build dir (transient; removed below)
      ansible.builtin.file:
        path: /opt/vmonkey
        state: directory
        mode: '0755'

    - name: Dockerfile for the canonical ViperMonkey (+ colorama)
      ansible.builtin.copy:
        dest: /opt/vmonkey/Dockerfile
        content: |
          FROM haroldogden/vipermonkey:latest
          RUN pypy -m pip install colorama
          WORKDIR /work
          ENTRYPOINT ["pypy","/opt/ViperMonkey/vipermonkey/vmonkey.py"]
        mode: '0644'

    - name: Build the working vmonkey image (idempotent)
      ansible.builtin.shell: |
        docker image inspect vmonkey-canonical:latest >/dev/null 2>&1 \
          || docker build -t vmonkey-canonical:latest /opt/vmonkey
      changed_when: false

    - name: Remove the vmonkey build dir (no build artifact left in /opt)
      ansible.builtin.file:
        path: /opt/vmonkey
        state: absent

    - name: Install a working `vmonkey` wrapper on PATH
      ansible.builtin.copy:
        dest: /usr/local/bin/vmonkey
        content: |
          #!/bin/bash
          # Canonical ViperMonkey (PyPy). Runs the target file inside the
          # container, mounting its directory as /work.
          set -e
          f="${1:?usage: vmonkey <file>}"
          d="$(cd "$(dirname "$f")" && pwd)"; b="$(basename "$f")"
          exec docker run --rm -v "$d":/work vmonkey-canonical:latest "$b"
        mode: '0755'

  # ─── impacket ───────────────────────────────────────────────
  # Installed via pipx for system-wide impacket CLI tools

    - name: Ensure pipx bin dir is in system-wide PATH
      ansible.builtin.copy:
        dest: /etc/profile.d/pipx_path.sh
        content: |
          export PATH="/usr/local/bin:$PATH"
        mode: '0644'


  # ─── Timesketch (DF-14) ─────────────────────────────────────
  # Deployed via the official helper script on top of the Docker
  # engine already installed above. Brings up its own stack:
  # OpenSearch + PostgreSQL + Redis + Timesketch web/worker + nginx.
  #

    - name: Create df13 directory in user home
      ansible.builtin.file:
        path: /home/user/df13
        state: directory
        owner: user
        group: user
        mode: '0755'

    - name: Copy the DF-13.3 maldoc to uavm
      ansible.builtin.copy:
        src: ../files/df13/Remittance_Advice_Q3.doc
        dest: /home/user/df13/Remittance_Advice_Q3.doc
        owner: user
        group: user
        mode: '0644'

    - name: Create the paste service BUILD context (transient; removed below)
      ansible.builtin.file:
        path: /opt/paste
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Stage the paste build context (Dockerfile, nginx config, payload, compose)
      ansible.builtin.copy:
        src: "../files/df13/paste/{{ item.src }}"
        dest: "/opt/paste/{{ item.dest }}"
        owner: root
        group: root
        mode: '0600'
      loop:
        - { src: Dockerfile.paste, dest: Dockerfile }
        - { src: paste-nginx.conf, dest: paste-nginx.conf }
        - { src: stage2.ps1, dest: stage2.ps1 }
        - { src: docker-compose.paste.yml, dest: docker-compose.yml }

    - name: Build the paste image with the content baked in (idempotent)
      ansible.builtin.shell: |
        docker image inspect paste-local:latest >/dev/null 2>&1 \
          || docker build -t paste-local:latest /opt/paste
      changed_when: false

    - name: Start the paste service (own bridge IP, no host port published)
      ansible.builtin.command: docker compose up -d
      args:
        chdir: /opt/paste
      changed_when: true

    - name: Remove the paste build context (no host-side copy of the served files)
      ansible.builtin.file:
        path: /opt/paste
        state: absent

    - name: Map the macro-decoded hostname to the paste container IP
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "172.28.0.10 raw.pastebox.lab"
        state: present

    - name: Null-route the (dead) C2 FQDN so it can never connect
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "0.0.0.0 update.microsofts-sync.com"
        state: present

  roles:
    - role: user-access
      user_access_username: user
      user_access_password: 'Password123'
      user_access_sudo: true


# ─────────────────────────────────────────────
#  MACHINE 2 - targetvm
# ─────────────────────────────────────────────
